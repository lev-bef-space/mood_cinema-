/* Мягкая светлая тема и улучшенные элементы поиска/избранного */
:root{color-scheme:dark}
.theme-toggle{border:1px solid #ffffff18;background:#ffffff08;color:var(--gold);padding:9px 12px;border-radius:10px;white-space:nowrap}
.hero-search{margin-top:24px;max-width:590px;display:flex;gap:8px;padding:7px;background:#ffffff12;border:1px solid #ffffff24;border-radius:15px;backdrop-filter:blur(14px);box-shadow:0 12px 35px #0002}

.hero-search input::placeholder{color:#d5cec7}

.heart:hover{transform:scale(1.09)}.heart.active{color:#ff8b9b;background:#531d2b;border-color:#ff8b9b55}

function renderCatalog(){const a=filtered();return `<section class="collection-intro"><div class="eyebrow">Коллекция</div><h1>Каталог фильмов</h1><p>Ищите любимое кино по названию, режиссёру, жанру или году. В библиотеке ${movies.length} уникальных фильмов.</p><div class="toolbar"><input class="field search" id="search" type="search" placeholder="Название, режиссёр, год…" value="${esc(state.query)}" aria-label="Поиск по каталогу"><select class="field" id="genre"><option value="">Все жанры</option>${genreSet.map(g=>`<option ${state.genre===g?'selected':''}>${esc(g)}</option>`).join('')}</select><select class="field" id="decade"><option value="">Любое десятилетие</option>${[1920,1930,1940,1950,1960,1970,1980,1990,2000,2010,2020].map(y=>`<option value="${y}" ${state.decade==y?'selected':''}>${y}-е</option>`).join('')}</select><select class="field" id="country"><option value="">Все страны</option>${countries.map(c=>`<option ${state.country===c?'selected':''}>${esc(c)}</option>`).join('')}</select><select class="field" id="sort"><option value="recommended">Порядок каталога</option><option value="title" ${state.sort==='title'?'selected':''}>По названию</option><option value="year-new" ${state.sort==='year-new'?'selected':''}>Сначала новые</option><option value="year-old" ${state.sort==='year-old'?'selected':''}>Сначала старые</option></select></div><div class="filter-row"><select class="field" id="duration"><option value="">Любая продолжительность</option><option value="short" ${state.duration==='short'?'selected':''}>До 100 минут</option><option value="medium" ${state.duration==='medium'?'selected':''}>100–140 минут</option><option value="long" ${state.duration==='long'?'selected':''}>Более 140 минут</option></select><button class="btn small" data-action="reset">Сбросить фильтры</button><button class="btn small" data-action="random">Случайный фильм ↗</button></div><div class="results-line"><span id="resultCount">Найдено: ${a.length}</span><span>Нажмите на постер, чтобы открыть фильм</span></div><div class="catalog-grid" id="catalogGrid">${a.length?a.slice(0,state.catalogLimit).map(card).join(''):`<div class="empty"><h3>Ничего не найдено</h3><p>Попробуйте изменить запрос или сбросить фильтры.</p><button class="btn primary" data-action="reset">Показать весь каталог</button></div>`}</div>${a.length>state.catalogLimit?`<div style="text-align:center;margin:28px 0 10px"><button class="btn primary" data-action="loadmore">Показать ещё ↗</button></div>`:''}</section>`}
function renderCollection(kind){const isFavPage=kind==='favorites';let list=isFavPage?[...state.favorites].map(getMovie).filter(Boolean):[...state.watchlist].map(getMovie).filter(Boolean);if(kind==='watched')list=[...state.watched].map(getMovie).filter(Boolean);return `<section class="collection-intro"><div class="eyebrow">Ваша синематека</div><h1>${isFavPage?'Избранное':kind==='watched'?'Просмотренные фильмы':'Буду смотреть'}</h1><p>${isFavPage?'Фильмы, к которым хочется вернуться.':kind==='watched'?'Ваша личная история просмотров.':'Список фильмов на будущее — ничего не потеряется после перезагрузки.'} · ${list.length} ${list.length===1?'фильм':'фильмов'}</p>${isFavPage&&list.length?'<div class="favorite-intro"><div><strong>Ваша личная коллекция</strong><span>Сохраняйте истории, которые хочется помнить и пересматривать.</span></div><span>♥ Избранное</span></div>':''}<div class="catalog-grid">${list.length?list.map(card).join(''):`<div class="empty"><h3>${isFavPage?'Здесь пока тихо и пусто':kind==='watched'?'Пока нет просмотренных фильмов':'Ваш следующий любимый фильм ещё впереди'}</h3><p>${isFavPage?'Отмечайте сердечком фильмы, которые вам особенно дороги.':kind==='watched'?'Отмечайте фильмы просмотренными из списка «Буду смотреть».':'Добавляйте фильмы из каталога, чтобы не забыть о них.'}</p><button class="btn primary" data-page="catalog">Открыть каталог ↗</button></div>`}</div></section>`}
function renderDetail(id){const m=getMovie(id);if(!m)return `<section class="collection-intro"><h1>Фильм не найден</h1><button class="btn" data-page="catalog">Вернуться в каталог</button></section>`;const similar=movies.filter(x=>x.id!==m.id&&x.genres.some(g=>m.genres.includes(g))).slice(0,6);return `<section class="detail-hero"><button class="back-btn" data-action="back">← Назад</button><div class="detail-layout"><div class="detail-poster" data-fallback="${esc(art(m).replace(/"/g,'&quot;'))}">${poster(m,true)}</div><div class="detail-copy"><div class="eyebrow">${esc(m.genres.slice(0,3).join(' · '))}</div><h1>${esc(m.title)}</h1><div class="original">${esc(m.original)}</div><div class="meta-line"><span>${m.year}</span><span>${m.duration} мин</span><span>${esc(m.country)}</span></div><h3 class="plot-heading">О чём этот фильм</h3><p class="description">${esc(m.description)}</p><div class="actions"><a class="btn primary" href="https://www.youtube.com/results?search_query=${encodeURIComponent(m.title+' '+m.year+' official trailer')}" target="_blank" rel="noopener noreferrer">▶ Трейлер</a><a class="btn google-link" href="https://www.google.com/search?q=${encodeURIComponent(m.title+" "+m.year+" фильм где посмотреть")}" target="_blank" rel="noopener noreferrer">Найти фильм в Google ↗</a><button class="btn ${isFav(m)?'wine':''}" data-action="favorite" data-id="${m.id}">${isFav(m)?'♥ В избранном':'♡ В избранное'}</button><button class="btn ${isWatch(m)?'primary':''}" data-action="watch" data-id="${m.id}">${isWatch(m)?'✓ В списке «Буду смотреть»':'＋ Буду смотреть'}</button>${(isWatch(m)||state.watched.has(m.id))?`<button class="btn" data-action="watched" data-id="${m.id}">${state.watched.has(m.id)?'↶ Вернуть в список':'✓ Уже посмотрел'}</button>`:''}</div><div class="facts"><div class="fact"><small>Режиссёр</small><span>${esc(m.director)}</span></div><div class="fact"><small>Страна</small><span>${esc(m.country)}</span></div><div class="fact"><small>Жанры</small><span>${esc(m.genres.join(', '))}</span></div><div class="fact"><small>Продолжительность</small><span>${m.duration} минут</span></div></div><div class="sub">Рейтинг намеренно не указан — это личная подборка, а не топ по оценкам.</div></div></div></section>${shelf('Похожие фильмы','Ещё истории в близком настроении',similar)}<section class="detail-extra"><button class="btn" data-action="back">← Вернуться назад</button></section>`}
const wikiPosterObserver=('IntersectionObserver' in window)?new IntersectionObserver(entries=>{entries.forEach(entry=>{if(!entry.isIntersecting)return;const img=entry.target;wikiPosterObserver.unobserve(img);loadWikiPoster(img)})},{rootMargin:'180px'}):null;
const wikiPosterCache=new Map();
async function loadWikiPoster(img){if(!img||img.dataset.wikiState)return;img.dataset.wikiState='loading';const title=img.dataset.wikiTitle;if(!title)return;try{let promise=wikiPosterCache.get(title);if(!promise){const url='https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=pageimages&piprop=thumbnail&pithumbsize=500&titles='+encodeURIComponent(title.replace(/ /g,'_'));promise=Promise.race([fetch(url).then(r=>{if(!r.ok)throw new Error('image lookup failed');return r.json()}),new Promise((_,reject)=>setTimeout(()=>reject(new Error('image lookup timeout')),8000))]).then(data=>{const pages=data?.query?.pages||{};const page=Object.values(pages)[0];return page?.thumbnail?.source||null}).catch(()=>null);wikiPosterCache.set(title,promise)}const src=await promise;if(!img.isConnected)return;if(src){img.src=src;img.dataset.wikiState='loaded'}else{img.dataset.wikiState='missing';if(img.parentElement?.dataset.fallback)img.outerHTML=img.parentElement.dataset.fallback}}catch(e){if(img.isConnected&&img.parentElement?.dataset.fallback)img.outerHTML=img.parentElement.dataset.fallback}}
function hydratePosters(root=document){root.querySelectorAll('img.wiki-poster:not([data-wiki-state])').forEach(img=>{if(wikiPosterObserver)wikiPosterObserver.observe(img);else loadWikiPoster(img)})}
function render(){document.getElementById('favCount').textContent=state.favorites.size;const themeBtn=document.getElementById('themeToggle');if(themeBtn){themeBtn.innerHTML=(state.theme==='light'?'☾':'☼')+' <span class="nav-label">'+(state.theme==='light'?'Тёмная':'Светлая')+'</span>';themeBtn.title=state.theme==='light'?'Включить тёмную тему':'Включить светлую тему';}document.getElementById('watchCount').textContent=state.watchlist.size;document.querySelectorAll('.nav [data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));const app=document.getElementById('app');if(state.detail!==null){app.innerHTML=renderDetail(state.detail);hydratePosters(app);return}if(state.page==='home')app.innerHTML=renderHome();else if(state.page==='catalog')app.innerHTML=renderCatalog();else if(state.page==='favorites'||state.page==='watchlist'||state.page==='watched')app.innerHTML=renderCollection(state.page);hydratePosters(app);if(!state.storageAvailable)toast('Браузер не разрешил доступ к сохранению данных.');}
function openDetail(id,from){const m=getMovie(id);if(!m)return;state.returnPage=from||state.page;state.detail=m.id;state.recent=[m.id,...state.recent.filter(x=>x!==m.id)].slice(0,10);try{localStorage.setItem('kino-recent-v1',JSON.stringify(state.recent))}catch(e){}render();window.scrollTo({top:0,behavior:'smooth'})}function setPage(page){state.detail=null;state.page=page;render();window.scrollTo({top:0,behavior:'smooth'})}
function toggle(set,key,storageKey,label){const id=Number(key);if(set.has(id)){set.delete(id);toast(`Удалено: ${label}`)}else{set.add(id);toast(`Добавлено: ${label}`)}save(storageKey,set);if(set===state.watchlist&&!set.has(id))state.watched.delete(id);render()}
function action(action,id){const m=getMovie(id);if(action==='theme'){state.theme=state.theme==='light'?'dark':'light';document.body.classList.toggle('light-theme',state.theme==='light');try{localStorage.setItem('kino-theme-v1',state.theme)}catch(e){}render();toast(state.theme==='light'?'Включена светлая тема':'Включена тёмная тема');return}if(action==='search-go'){setPage('catalog');return}if(action==='detail'){openDetail(id,state.page);return}if(action==='favorite'&&m){toggle(state.favorites,id,'kino-favorites-v1',m.title);return}if(action==='watch'&&m){if(state.watchlist.has(m.id)){state.watchlist.delete(m.id);state.watched.delete(m.id);toast('Удалено из списка «Буду смотреть»')}else{state.watchlist.add(m.id);state.watched.delete(m.id);toast('Добавлено в список «Буду смотреть»')}save('kino-watchlist-v1',state.watchlist);save('kino-watched-v1',state.watched);render();return}if(action==='watched'&&m){if(state.watched.has(m.id)){state.watched.delete(m.id);state.watchlist.add(m.id);toast('Фильм возвращён в список')}else{state.watched.add(m.id);state.watchlist.delete(m.id);toast('Отмечено как просмотренное')}save('kino-watched-v1',state.watched);save('kino-watchlist-v1',state.watchlist);render();return}if(action==='random'){pickRandom();return}if(action==='loadmore'){state.catalogLimit+=48;render();return}if(action==='reset'){state.query='';state.genre='';state.decade='';state.country='';state.duration='';state.sort='recommended';state.catalogLimit=48;render();return}if(action==='back'){state.detail=null;state.page=state.returnPage||'catalog';render();window.scrollTo({top:0,behavior:'smooth'});return}}
document.addEventListener('click',e=>{const page=e.target.closest('[data-page]');if(page){setPage(page.dataset.page);return}const mood=e.target.closest('[data-mood]');if(mood){state.mood=mood.dataset.mood;render();return}const genre=e.target.closest('[data-genre]');if(genre){state.genre=genre.dataset.genre;state.page='catalog';state.detail=null;render();window.scrollTo({top:0,behavior:'smooth'});return}const act=e.target.closest('[data-action]');if(act){e.stopPropagation();action(act.dataset.action,act.dataset.id);return}const movie=e.target.closest('[data-open]');if(movie)openDetail(movie.dataset.open,state.page)});document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-open]')){e.preventDefault();openDetail(e.target.dataset.open,state.page)}});
document.addEventListener('input',e=>{if(e.target.id==='search'){state.query=e.target.value;state.catalogLimit=48;const a=filtered();const grid=document.getElementById('catalogGrid');if(grid){grid.innerHTML=a.length?a.slice(0,state.catalogLimit).map(card).join(''):`<div class="empty"><h3>Ничего не найдено</h3><p>Попробуйте изменить запрос или сбросить фильтры.</p><button class="btn primary" data-action="reset">Показать весь каталог</button></div>`;document.getElementById('resultCount').textContent='Найдено: '+a.length;hydratePosters(grid)} }});
document.addEventListener('change',e=>{if(['genre','decade','country','duration','sort'].includes(e.target.id)){state[e.target.id==='genre'?'genre':e.target.id]=e.target.value;state.catalogLimit=48;render()}});document.getElementById('homeBtn').addEventListener('click',()=>setPage('home'));document.addEventListener('submit',e=>{if(e.target.id==='heroSearchForm'){e.preventDefault();state.query=document.getElementById('homeSearch').value.trim();state.genre='';state.decade='';state.country='';state.duration='';state.sort='recommended';setPage('catalog');}});
render();
</script><button type="button" id="cinemaFullscreen" style="position:fixed;right:18px;bottom:18px;z-index:100;background:#c9a76a;color:#171310;border-radius:999px;padding:10px 13px">⛶ Полный экран</button><script>document.addEventListener('DOMContentLoaded',()=>{const b=document.getElementById('cinemaFullscreen');if(!b)return;b.addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen({navigationUI:'hide'})}catch(e){b.title='Полноэкранный режим недоступен в этом браузере'}});document.addEventListener('fullscreenchange',()=>{const active=!!document.fullscreenElement;b.title=active?'Выйти из полного экрана':'На весь экран';b.setAttribute('aria-label',b.title);const label=b.querySelector('.nav-label');if(label)label.textContent=active?'Выйти из полного экрана':'Полный экран'})});
</script></body></html>
